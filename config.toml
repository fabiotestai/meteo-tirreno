# Configurazione del sistema meteo Tirreno–Ligure.
# Tutto quello che si vuole cambiare (zona, modelli, spot) si cambia qui.

[area]
# Riquadro: Mar Ligure, Corsica nord, Arcipelago Toscano, alto Tirreno
lon_min = 7.6
lon_max = 11.8
lat_min = 41.8
lat_max = 44.6
# Passo della griglia per la mappa del vento (gradi).
# 0.2 = ~22 x 15 punti. Ogni punto conta come una chiamata all'API gratuita
# di Open-Meteo (limite ~10.000 al giorno): non scendere sotto 0.15 senza ricalcolare.
grid_step = 0.2

[forecast]
hours = 72            # orizzonte (ICON-2I arriva a 72 ore)
substep_minutes = 30  # passo della timeline: le uscite orarie vengono interpolate a 30 minuti

# Modelli, nell'ordine in cui compaiono nel selettore della mappa.
# "id" è il nome del modello per l'API di Open-Meteo.
[[models]]
id = "italia_meteo_arpae_icon_2i"
label = "ICON-2I"
note = "ItaliaMeteo, ~2 km, 2 corse al giorno"

[[models]]
id = "icon_eu"
label = "ICON-EU"
note = "DWD, ~7 km, corse ogni 3 ore"

[[models]]
id = "ecmwf_ifs025"
label = "ECMWF"
note = "IFS open data 0.25°, 4 corse al giorno"

# Spot costieri: previsione dettagliata (vento, raffiche, onda) per punto.
# Coordinate leggermente al largo, così il modello d'onda non le scarta come terra.
[[spots]]
name = "Marina di Carrara"
lat = 44.02
lon = 10.01

[[spots]]
name = "Golfo della Spezia"
lat = 44.04
lon = 9.86

[[spots]]
name = "Viareggio"
lat = 43.86
lon = 10.18

[[spots]]
name = "Portofino"
lat = 44.29
lon = 9.22

[[spots]]
name = "Genova"
lat = 44.38
lon = 8.92

[[spots]]
name = "Livorno"
lat = 43.54
lon = 10.24

[[spots]]
name = "Capraia"
lat = 43.04
lon = 9.88

[[spots]]
name = "Portoferraio (Elba)"
lat = 42.84
