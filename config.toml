# Configurazione del sistema meteo Tirreno–Ligure.
# Tutto quello che si vuole cambiare (zona, modelli, spot) si cambia qui.

[area]
# Riquadro: Mar Ligure, Corsica nord, Arcipelago Toscano, alto Tirreno
lon_min = 7.6
lon_max = 11.8
lat_min = 41.8
lat_max = 44.6
# Passo della griglia per la mappa del vento (gradi).
# 0.2 = ~22 x 15 punti. Ogni punto conta come una chiamata all'API gratuita
# di Open-Meteo (limite ~10.000 al giorno): non scendere sotto 0.15 senza ricalcolare.
grid_step = 0.2

[forecast]
hours = 72            # orizzonte (ICON-2I arriva a 72 ore)
substep_minutes = 30  # passo della timeline: le uscite orarie vengono interpolate a 30 minuti

# Modelli, nell'ordine in cui compaiono nel selettore della mappa.
# "id" è il nome del modello per l'API di Open-Meteo.
[[models]]
id = "italia_meteo_arpae_icon_2i"
label = "ICON-2I"
note = "ItaliaMeteo, ~2 km, 2 corse al giorno"
# primo giorno con previsioni passate su Open-Meteo (previous runs), verificato il 18/10/2026
archivio_dal = "2025-04-14"
meta = "italia_meteo_arpae_icon_2i"   # cartella dati di Open-Meteo: dice da quale corsa vengono le previsioni

[[models]]
id = "icon_eu"
label = "ICON-EU"
note = "DWD, ~7 km, corse ogni 3 ore"
archivio_dal = "2024-01-19"

[[models]]
id = "ecmwf_ifs025"
label = "ECMWF"
note = "IFS open data 0.25°, 4 corse al giorno"
archivio_dal = "2024-02-04"

# Spot costieri: previsione dettagliata (vento, raffiche, onda) per punto.
# Coordinate leggermente al largo, così il modello d'onda non le scarta come terra.
[[spots]]
name = "Marina di Carrara"
lat = 44.02
lon = 10.01

[[spots]]
name = "Golfo della Spezia"
lat = 44.04
lon = 9.86

[[spots]]
name = "Viareggio"
lat = 43.86
lon = 10.18

[[spots]]
name = "Portofino"
lat = 44.29
lon = 9.22

[[spots]]
name = "Genova"
lat = 44.38
lon = 8.92

[[spots]]
name = "Livorno"
lat = 43.54
lon = 10.24

[[spots]]
name = "Capraia"
lat = 43.04
lon = 9.88

[[spots]]
name = "Portoferraio (Elba)"
lat = 42.84
lon = 10.32

# Verifica previsto/osservato (python -m meteo.verifica).
# Le previsioni si prendono alle coordinate della stazione, non dello spot:
# così si misura l'errore del modello dove il vento è stato misurato davvero.
[verifica]
dal = "2024-01-01"
giorni_anticipo = 2               # 0, 1, 2 = le 72 ore della mappa
vento_minimo_direzione_kn = 4.0   # sotto, l'errore di direzione non si conta

# Modelli valutati solo nella verifica, ciascuno contro un modello di riferimento
# sulle sole ore che hanno in comune: non entrano nel campione comune dei modelli
# della mappa (che altrimenti si accorcerebbe al loro archivio).
[[verifica.confronti]]
id = "meteofrance_arome_france_hd"
label = "AROME HD"
note = "Météo-France, ~1,3 km, corse ogni 3 ore, orizzonte ~48 h"
archivio_dal = "2026-08-07"   # previous runs su Open-Meteo, verificato il 18/10/2026
giorni_anticipo = 1           # l'orizzonte non arriva al giorno 2
riferimento = "ICON-2I"

# Stazioni ARPAL (archivio "Ambiente in Liguria"); coordinate e quota da OMIRL.
# omirl = codice della stessa stazione nel tempo reale OMIRL (ultimi 7 giorni a 10 minuti).
# in_mappa = il MOS di questa stazione compare nella scheda dello spot (una stazione per spot).
[[verifica.stazioni]]
spot = "Genova"
nome = "Genova - Porto Antico"
codice = "ME00309"
omirl = "GEPOA"
lat = 44.40816
lon = 8.92317
quota_m = 25
in_mappa = true

[[verifica.stazioni]]
spot = "Golfo della Spezia"
nome = "La Spezia"
codice = "ME00094"
omirl = "SPZIA"
lat = 44.10703
lon = 9.82819
quota_m = 35
in_mappa = true

[[verifica.stazioni]]
spot = "Golfo della Spezia"
nome = "Portovenere"
codice = "ME00208"
omirl = "PVENE"
lat = 44.052
lon = 9.83594
quota_m = 40

[[verifica.stazioni]]
spot = "Marina di Carrara"
nome = "Luni - Provasco"
codice = "ME00265"
omirl = "LUNIS"
lat = 44.07491
lon = 10.00899
quota_m = 5
in_mappa = true

# Correzione statistica (python -m meteo.mos, dopo meteo.verifica).
[mos]
test_dal = "2026-04-14"       # si allena prima, si misura dopo: 6 mesi mai visti
lambda = [3, 30, 300, 3000]   # quanto i settori sono tirati verso il fit comune (scelto in allenamento)
raffiche = ["ICON-2I", "ICON-EU"]   # ECMWF open data ha le raffiche solo al giorno 0, quindi non entra nel MOS delle raffiche
